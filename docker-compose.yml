# ─────────────────────────────────────────────────────────────────────────────
# Two independent OpenSearch 1.3.x (ES-7.10 compatible) clusters
#
# SOURCE cluster  →  HTTP :9200   Dashboards :5601
# TARGET cluster  →  HTTP :9201   Dashboards :5602
#
# Snapshots → MinIO (:9000) — local S3-compatible store.
# Every OpenSearch node runs config/keystore-entrypoint.sh on startup to inject
# S3 credentials into the keystore (secure settings cannot be plain env vars).
# ─────────────────────────────────────────────────────────────────────────────

x-os-base: &os-base
  build:
    context: .
    dockerfile: Dockerfile   # opensearch:1.3.14 + repository-s3 plugin
  entrypoint: ["sh", "/config/keystore-entrypoint.sh"]
  ulimits:
    memlock: { soft: -1, hard: -1 }
    nofile:  { soft: 65536, hard: 65536 }
  restart: unless-stopped
  networks:
    - opensearch-net

x-os-base-env: &os-base-env
  # Default heap for data nodes; master nodes override this key below.
  OPENSEARCH_JAVA_OPTS: "-Xms${DATA_HEAP:-256m} -Xmx${DATA_HEAP:-256m}"
  DISABLE_SECURITY_PLUGIN: "true"
  DISABLE_INSTALL_DEMO_CONFIG: "true"

# Non-secret S3 settings. Credentials go in the keystore via keystore-entrypoint.sh.
x-s3-env: &s3-env
  s3.client.default.endpoint: "http://minio:9000"
  s3.client.default.path_style_access: "true"
  s3.client.default.protocol: http
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}

# ── volumes ───────────────────────────────────────────────────────────────────
volumes:
  src-master-1-data:
  src-master-2-data:
  src-data-1-data:
  src-data-2-data:
  src-data-3-data:
  tgt-master-1-data:
  tgt-master-2-data:
  tgt-data-1-data:
  tgt-data-2-data:
  tgt-data-3-data:
  minio-data:

networks:
  opensearch-net:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
services:

# ── MinIO (local S3) ─────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - opensearch-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
        mc mb --ignore-existing local/${S3_BUCKET:-opensearch-snapshots} &&
        echo 'Bucket ready'
      "
    networks:
      - opensearch-net

# ── SOURCE CLUSTER ────────────────────────────────────────────────────────────
  src-master-1:
    <<: *os-base
    container_name: src-master-1
    environment:
      <<: [*os-base-env, *s3-env]
      OPENSEARCH_JAVA_OPTS: "-Xms${MASTER_HEAP:-192m} -Xmx${MASTER_HEAP:-192m}"
      cluster.name: source-cluster
      node.name: src-master-1
      node.master: "true"
      node.data: "false"
      node.ingest: "false"
      discovery.seed_hosts: "src-master-1,src-master-2"
      cluster.initial_master_nodes: "src-master-1,src-master-2"
    volumes:
      - ./config/keystore-entrypoint.sh:/config/keystore-entrypoint.sh:ro
      - src-master-1-data:/usr/share/opensearch/data
    depends_on:
      minio:
        condition: service_healthy

  src-master-2:
    <<: *os-base
    container_name: src-master-2
    environment:
      <<: [*os-base-env, *s3-env]
      OPENSEARCH_JAVA_OPTS: "-Xms${MASTER_HEAP:-192m} -Xmx${MASTER_HEAP:-192m}"
      cluster.name: source-cluster
      node.name: src-master-2
      node.master: "true"
      node.data: "false"
      node.ingest: "false"
      discovery.seed_hosts: "src-master-1,src-master-2"
      cluster.initial_master_nodes: "src-master-1,src-master-2"
    volumes:
      - ./config/keystore-entrypoint.sh:/config/keystore-entrypoint.sh:ro
      - src-master-2-data:/usr/share/opensearch/data
    depends_on:
      minio:
        condition: service_healthy

  src-data-1:
    <<: *os-base
    container_name: src-data-1
    environment:
      <<: [*os-base-env, *s3-env]
      cluster.name: source-cluster
      node.name: src-data-1
      node.master: "false"
      node.data: "true"
      node.ingest: "true"
      discovery.seed_hosts: "src-master-1,src-master-2"
      cluster.initial_master_nodes: "src-master-1,src-master-2"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - ./config/keystore-entrypoint.sh:/config/keystore-entrypoint.sh:ro
      - src-data-1-data:/usr/share/opensearch/data
    depends_on:
      - src-master-1
      - src-master-2

  src-data-2:
    <<: *os-base
    container_name: src-data-2
    environment:
      <<: [*os-base-env, *s3-env]
      cluster.name: source-cluster
      node.name: src-data-2
      node.master: "false"
      node.data: "true"
      node.ingest: "true"
      discovery.seed_hosts: "src-master-1,src-master-2"
      cluster.initial_master_nodes: "src-master-1,src-master-2"
    volumes:
      - ./config/keystore-entrypoint.sh:/config/keystore-entrypoint.sh:ro
      - src-data-2-data:/usr/share/opensearch/data
    depends_on:
      - src-master-1
      - src-master-2

  src-data-3:
    <<: *os-base
    container_name: src-data-3
    environment:
      <<: [*os-base-env, *s3-env]
      cluster.name: source-cluster
      node.name: src-data-3
      node.master: "false"
      node.data: "true"
      node.ingest: "true"
      discovery.seed_hosts: "src-master-1,src-master-2"
      cluster.initial_master_nodes: "src-master-1,src-master-2"
    volumes:
      - ./config/keystore-entrypoint.sh:/config/keystore-entrypoint.sh:ro
      - src-data-3-data:/usr/share/opensearch/data
    depends_on:
      - src-master-1
      - src-master-2

  src-dashboards:
    image: opensearchproject/opensearch-dashboards:1.3.14
    container_name: src-dashboards
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://src-data-1:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    networks:
      - opensearch-net
    depends_on:
      - src-data-1
      - src-data-2
      - src-data-3
    restart: unless-stopped

# ── TARGET CLUSTER ────────────────────────────────────────────────────────────
  tgt-master-1:
    <<: *os-base
    container_name: tgt-master-1
    environment:
      <<: [*os-base-env, *s3-env]
      OPENSEARCH_JAVA_OPTS: "-Xms${MASTER_HEAP:-192m} -Xmx${MASTER_HEAP:-192m}"
      cluster.name: target-cluster
      node.name: tgt-master-1
      node.master: "true"
      node.data: "false"
      node.ingest: "false"
      discovery.seed_hosts: "tgt-master-1,tgt-master-2"
      cluster.initial_master_nodes: "tgt-master-1,tgt-master-2"
      reindex.remote.whitelist: "src-data-1:9200,src-data-2:9200,src-data-3:9200"
    volumes:
      - ./config/keystore-entrypoint.sh:/config/keystore-entrypoint.sh:ro
      - tgt-master-1-data:/usr/share/opensearch/data
    depends_on:
      minio:
        condition: service_healthy

  tgt-master-2:
    <<: *os-base
    container_name: tgt-master-2
    environment:
      <<: [*os-base-env, *s3-env]
      OPENSEARCH_JAVA_OPTS: "-Xms${MASTER_HEAP:-192m} -Xmx${MASTER_HEAP:-192m}"
      cluster.name: target-cluster
      node.name: tgt-master-2
      node.master: "true"
      node.data: "false"
      node.ingest: "false"
      discovery.seed_hosts: "tgt-master-1,tgt-master-2"
      cluster.initial_master_nodes: "tgt-master-1,tgt-master-2"
      reindex.remote.whitelist: "src-data-1:9200,src-data-2:9200,src-data-3:9200"
    volumes:
      - ./config/keystore-entrypoint.sh:/config/keystore-entrypoint.sh:ro
      - tgt-master-2-data:/usr/share/opensearch/data
    depends_on:
      minio:
        condition: service_healthy

  tgt-data-1:
    <<: *os-base
    container_name: tgt-data-1
    environment:
      <<: [*os-base-env, *s3-env]
      cluster.name: target-cluster
      node.name: tgt-data-1
      node.master: "false"
      node.data: "true"
      node.ingest: "true"
      discovery.seed_hosts: "tgt-master-1,tgt-master-2"
      cluster.initial_master_nodes: "tgt-master-1,tgt-master-2"
      reindex.remote.whitelist: "src-data-1:9200,src-data-2:9200,src-data-3:9200"
    ports:
      - "9201:9200"
      - "9601:9600"
    volumes:
      - ./config/keystore-entrypoint.sh:/config/keystore-entrypoint.sh:ro
      - tgt-data-1-data:/usr/share/opensearch/data
    depends_on:
      - tgt-master-1
      - tgt-master-2

  tgt-data-2:
    <<: *os-base
    container_name: tgt-data-2
    environment:
      <<: [*os-base-env, *s3-env]
      cluster.name: target-cluster
      node.name: tgt-data-2
      node.master: "false"
      node.data: "true"
      node.ingest: "true"
      discovery.seed_hosts: "tgt-master-1,tgt-master-2"
      cluster.initial_master_nodes: "tgt-master-1,tgt-master-2"
      reindex.remote.whitelist: "src-data-1:9200,src-data-2:9200,src-data-3:9200"
    volumes:
      - ./config/keystore-entrypoint.sh:/config/keystore-entrypoint.sh:ro
      - tgt-data-2-data:/usr/share/opensearch/data
    depends_on:
      - tgt-master-1
      - tgt-master-2

  tgt-data-3:
    <<: *os-base
    container_name: tgt-data-3
    environment:
      <<: [*os-base-env, *s3-env]
      cluster.name: target-cluster
      node.name: tgt-data-3
      node.master: "false"
      node.data: "true"
      node.ingest: "true"
      discovery.seed_hosts: "tgt-master-1,tgt-master-2"
      cluster.initial_master_nodes: "tgt-master-1,tgt-master-2"
      reindex.remote.whitelist: "src-data-1:9200,src-data-2:9200,src-data-3:9200"
    volumes:
      - ./config/keystore-entrypoint.sh:/config/keystore-entrypoint.sh:ro
      - tgt-data-3-data:/usr/share/opensearch/data
    depends_on:
      - tgt-master-1
      - tgt-master-2

  tgt-dashboards:
    image: opensearchproject/opensearch-dashboards:1.3.14
    container_name: tgt-dashboards
    ports:
      - "5602:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://tgt-data-1:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    networks:
      - opensearch-net
    depends_on:
      - tgt-data-1
      - tgt-data-2
      - tgt-data-3
    restart: unless-stopped
